# nginx/ems.conf — CICD-05 (reverse proxy) + CICD-08 (SSL)
#
# Cara pasang di server (Ubuntu/Debian):
#   sudo cp nginx/ems.conf /etc/nginx/sites-available/ems
#   sudo ln -s /etc/nginx/sites-available/ems /etc/nginx/sites-enabled/ems
#   sudo nginx -t && sudo systemctl reload nginx
#
# SEBELUM baris `listen 443` di bawah bisa aktif, sertifikat SSL harus sudah
# ada dulu — lihat docs/DEPLOYMENT.md bagian "Domain & SSL" untuk langkah
# Certbot lengkap (certbot --nginx otomatis mengisi blok ssl_certificate di
# bawah & menambahkan blok 443 kalau belum ada — file ini sudah menyiapkan
# strukturnya agar Certbot tinggal melengkapi).
#
# GANTI `example.com` di bawah ke domain asli sebelum dipakai.

# Redirect HTTP -> HTTPS, KECUALI path challenge ACME Certbot (harus tetap
# bisa diakses via HTTP biasa saat proses penerbitan/perpanjangan sertifikat).
server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name example.com www.example.com;

    # Diisi otomatis oleh `certbot --nginx` — lihat docs/DEPLOYMENT.md.
    # ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    # include             /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam         /etc/letsencrypt/ssl-dhparam.pem;

    access_log /var/log/nginx/ems.access.log;
    error_log  /var/log/nginx/ems.error.log;

    # PENTING: harus >= UPLOAD_MAX_FILE_SIZE_MB di .env produksi (default 5MB;
    # nilai di bawah dikasih ruang lebih untuk overhead multipart & perubahan
    # config di masa depan tanpa perlu ingat sinkronkan dua tempat tiap kali).
    client_max_body_size 10M;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Banner/attachment event: file statis, lebih efisien dilayani Nginx
    # langsung drpd lewat Node — SESUAIKAN path ini dgn lokasi deploy asli
    # (DEPLOY_PATH di secrets GitHub Actions harus sama).
    location /uploads/ {
        alias /var/www/ems/src/public/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WAJIB utk app di belakang proxy ini: set TRUST_PROXY=1 di .env
        # produksi (lihat SECURITY-CHECKLIST.md) — tanpa header di bawah
        # SEKALIGUS tanpa TRUST_PROXY yg benar, req.ip yg dipakai rate
        # limiting (Epic SEC) jadi salah (selalu terbaca sbg IP Nginx sendiri,
        # bukan IP pengunjung asli).
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Xendit mengirim webhook POST ke /api/webhooks/xendit — pastikan
        # timeout cukup longgar & upgrade header tidak diperlukan di sini
        # (bukan WebSocket), tapi tetap teruskan apa adanya.
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}
